            fourier: `
                <svg viewBox="0 0 400 300" class="w-full h-full drop-shadow-lg" preserveAspectRatio="xMidYMid meet">

        const transformData = [
            {
                id: 'continuo',
                title: 'Tiempo Continuo',
                math: '$$x(t)$$',
                text: 'El pastel completo a lo largo de su existencia. Observamos la señal continua fluyendo ininterrumpidamente en el tiempo. Esta es nuestra perspectiva natural.',
                svg: svgs.continuo
            },
            {
                id: 'discreto',
                title: 'Tiempo Discreto',
                math: '$$x[n] = x(nT_s)$$',
                text: 'Tomamos muestras (rebanadas) del pastel a intervalos regulares. Ya no vemos el pastel continuo, sino una secuencia discreta de partes separadas por un tiempo $T_s$.',
                svg: svgs.discreto
            },
            {
                id: 'laplace',
                title: 'Transformada de Laplace',
                math: '$$X(s) = \\int_{0}^{\\infty} x(t) e^{-st} dt$$',
                text: 'Analizamos la <strong>estructura interna</strong> y los ingredientes base. Al pasar al dominio complejo $s = \\sigma + j\\omega$, la parte real ($\\sigma$) revela si la levadura hace que el pastel crezca al infinito o colapse (<strong>estabilidad</strong>), y la parte imaginaria ($j\\omega$) revela su textura u oscilación.',
                svg: svgs.laplace
            },
            {
                id: 'z',
                title: 'Transformada Z',
                math: '$$X(z) = \\sum_{n=0}^{\\infty} x[n] z^{-n}$$',
                text: 'El equivalente a Laplace, pero aplicado a las <strong>rebanadas discretas</strong>. El plano complejo se mapea diferente: la estabilidad ahora depende de si los polos caen dentro de un "plato" delimitado por el círculo unitario ($|z| = 1$).',
                svg: svgs.z
            },
            {
                id: 'fourier',
                title: 'Transformada de Fourier',
                math: '$$X(j\\omega) = \\int_{-\\infty}^{\\infty} x(t) e^{-j\\omega t} dt$$',
                text: 'Un caso particular de Laplace donde la parte real es nula ($\\sigma = 0$). Metemos el pastel a la licuadora y extraemos los <strong>sabores puros (frecuencias)</strong>. Nos dice exactamente de qué está hecho (e.g. 30% chocolate, 20% vainilla), pero <strong>perdemos completamente la noción de cuándo</strong> ocurre cada sabor.',

            },
            {
                id: 'wavelet',
                title: 'Transformada Wavelet',
                math: '$$X(a,b) = \\frac{1}{\\sqrt{a}} \\int_{-\\infty}^{\\infty} x(t) \\psi\\left(\\frac{t-b}{a}\\right) dt$$',
                text: 'Análisis combinado de tiempo ($b$) y escala/frecuencia ($a$). Soluciona el problema de Fourier: nos permite saber <strong>exactamente en qué rebanada</strong> (cuándo) aparece un <strong>sabor específico</strong> (frecuencia). Es como un mapa térmico del pastel.',

            transformData.forEach(data => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-3 rounded-xl font-medium text-left transition-all duration-300 flex items-center border ${
                    data.id === currentId 
                        ? 'bg-blue-600 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]' 
                        : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white'
                }`;
                btn.innerHTML = `<span class="truncate w-full">${data.title}</span>`;
                btn.onclick = () => updateState(data.id);
                btn.id = `btn-${data.id}`;
                controlsContainer.appendChild(btn);
            });
        }

        function updateButtons(activeId) {
            transformData.forEach(data => {
                const btn = document.getElementById(`btn-${data.id}`);
                if (data.id === activeId) {
                    btn.className = 'px-4 py-3 rounded-xl font-medium text-left transition-all duration-300 flex items-center border bg-blue-600 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]';
                } else {
                    btn.className = 'px-4 py-3 rounded-xl font-medium text-left transition-all duration-300 flex items-center border bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white';
                }
            });
        }

        async function updateState(id) {
            currentId = id;
            updateButtons(id);
            
            const data = transformData.find(d => d.id === id);
            if (!data) return;

            // Trigger reflow animation for visuals
            visualContainer.classList.remove('fade-in');
            void visualContainer.offsetWidth; 
            visualContainer.classList.add('fade-in');
            
            // Inject new SVG
            visualContainer.innerHTML = data.svg;

            // Update Text Content
            infoTitle.textContent = data.title;
            infoText.innerHTML = data.text;

            // Update MathJax (crucial step for dynamic LaTeX)
            mathDisplay.innerHTML = data.math;
            
            if (window.MathJax) {
                try {
                    // Typeset promise ensures the new content gets rendered as LaTeX formulas
                    await window.MathJax.typesetPromise([mathDisplay, infoText]);
                } catch (err) {
                    console.error("Error rendering MathJax:", err);
                }
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            createButtons();
            updateState(currentId);
        });

    </script>
</body>
</html>
